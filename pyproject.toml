[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hookguard"
version = "0.1.0"
description = "Resilient webhook gateway with HMAC verification, SQLite WAL dead-letter queue, and exponential backoff dispatch."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kacper"}
]
keywords = ["webhooks", "dlq", "hmac", "proxy", "resilience", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hookguard = "hookguard.cli:main"

[tool.setuptools.packages.find]
include = ["hookguard*"]
